<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <!-- https://material.io/resources/icons/?style=outline -->
<link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined"
      rel="stylesheet">
<!-- https://material.io/resources/icons/?style=round -->
<link href="https://fonts.googleapis.com/css2?family=Material+Icons+Round"
      rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/glass.css">
    <link rel="stylesheet" href="styles/starsbg.css">
  </head>
<body class="bg-black">

  <!-- Permanenter Hintergrund -->
  <div class="stars-bg fixed inset-0 z-0 pointer-events-none">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>
  </div>

  <!-- HERO -->
  <section class="relative z-10 min-h-screen bg-transparent">
    <div id="hero" class="flex flex-col items-center justify-center w-full min-h-screen">
    <div class="glass rounded-xl p-6 m-3 text-white flex flex-col justify-center items-center">
      <p class="text-3xl cal-sans">wir wollen etwas bewegen<span class="text-red-600">.</span></p>
      <div class="w-3/4 h-px bg-slate-400/60 mx-auto my-6"></div>
      <p class="text-xl text-slate-500 google-sans-gs font-bold">Wir sind das <span class="text-red-600 decoration-solid decoration-red-600 underline">Bündnis Kevin Teller</span></p>
      </p>
    </div>
    </div>
  </section>

  <!-- RESTLICHER CONTENT -->
  <section class="relative z-20 bg-black p-10">
    
    <div class="glass rounded-xl flex flex-col items-center justify-center p-5 w-full max-w-md mx-auto">

  <!-- Überschrift -->
  <p class="google-sans-gs font-bold text-2xl text-white text-center">
    hier findest du uns<span class="text-red-600 cal-sans">:</span>
  </p>

  <!-- Divider -->
  <div class="w-3/4 h-px bg-slate-400/60 my-6"></div>

  <!-- Social Grid -->
  <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 w-full justify-items-center">

    <a
      href="#"
      aria-label="Twitch"
      class="glass rounded-xl size-12 flex items-center justify-center
             text-2xl text-violet-500
             transition-all duration-200
             hover:scale-110 hover:text-violet-400"
    >
      <i class="bi bi-twitch"></i>
    </a>

    <a
      href="#"
      aria-label="YouTube"
      class="glass rounded-xl size-12 flex items-center justify-center
             text-2xl text-red-500
             transition-all duration-200
             hover:scale-110 hover:text-red-400"
    >
      <i class="bi bi-youtube"></i>
    </a>

    <a
      href="#"
      aria-label="Reddit"
      class="glass rounded-xl size-12 flex items-center justify-center
             text-2xl text-orange-500
             transition-all duration-200
             hover:scale-110 hover:text-orange-400"
    >
      <i class="bi bi-reddit"></i>
    </a>
        <a
      href="#"
      aria-label="Discord"
      class="glass rounded-xl size-12 flex items-center justify-center
             text-2xl text-indigo-500
             transition-all duration-200
             hover:scale-110 hover:text-indigo-400"
    >
      <i class="bi bi-discord"></i>
    </a>

  </div>

</div>
    
  </section>
  <section class="relative min-h-screen overflow-hidden bg-black">

  <!-- Roter Partikel-Canvas -->
  <canvas id="redParticles"></canvas>

  <!-- Content über den Partikeln -->
  <div class="relative z-10 min-h-screen flex items-center justify-center p-6">
    
    <div class="glass rounded-2xl p-8 text-white">
      <h2 class="text-3xl cal-sans font-bold mb-5">
        unser wahlprogramm<span class="text-red-600">:</span>
      </h2>

      <div class="rounded-xl border-2 border-slate-400 p-3">
        <div class="flex flex-col gap-1">
          <button
  class="
    group
    flex flex-col items-center
    p-2 rounded-lg
    bg-black

    transition-all duration-300

    hover:scale-105
    hover:bg-orange-950

    focus:scale-105
    focus:bg-orange-950

    active:scale-95
    active:bg-red-950
  "
>
            <span class="material-icons-round group-focus:text-red-500 transform ease-in-out duration-300 ">
paid
</span> 
<div class="w-3/4 h-px bg-slate-400/60 mx-auto my-1"></div>
            <p class="text-white cal-sans text-lg">Test</p>
          </button>
        </div>
      </div>
    </div>

  </div>

</section>
  <script src="scripts/particles.js"></script>
</body>
</html>
